    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">

    <style>
      html, body {
        background-color: #ffffff;
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }

      /* === LOADING SCREEN === */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.6s ease;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #loading-gif {
        width: 600px;
        height: auto;
      }

      /* === HEADER === */
      #header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }

      #header img {
        width: 100%;
        height: auto;
        display: block;
        max-height: 18vh;
      }

      /* === MAP AREA === */
      #map {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* === NORTH ARROW === */
      #north-arrow {
        position: absolute;
        left: 50px;
        width: 96px;
        height: 96px;
        background-image: url('resources/north_arrow.png');
        background-size: contain;
        background-repeat: no-repeat;
        cursor: pointer;
        z-index: 9999;
        opacity: 0.9;
        transition: transform 0.3s ease;
      }
      #north-arrow:hover {
        transform: scale(1.1);
      }

      /* === UI COLORS === */
      .ol-control > * {
        background-color: #f8f8f8!important;
        color: #444!important;
        border-radius: 0px;
      }
      .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
        color: #444!important;
      }
      .search-layer-input-search {
        background-color: #f8f8f8!important;
      }
      .ol-control > *:focus, .ol-control > *:hover {
        background-color: rgba(248, 248, 248, 0.7)!important;
      }
      .ol-control {
        background-color: rgba(255,255,255,.4) !important;
        padding: 2px !important;
      }

      /* === RESPONSIF === */
      @media (max-width: 768px) {
        #header img {
          max-height: 15vh;
        }
        #north-arrow {
          width: 70px;
          height: 70px;
          left: 50px;
        }
      }
    </style>

    <title>Indonesia Geospasial - Potensi Mineral Logam</title>
  </head>

  <body>
    <!-- === LOADING SCREEN === -->
    <div id="loading-screen">
      <img id="loading-gif" src="resources/loading.gif" alt="Loading...">
    </div>

    <!-- === HEADER GRAFIS === -->
    <div id="header">
      <img src="images/header_peta.png" alt="Header Geospasial">
    </div>

    <!-- === MAP AREA === -->
    <div id="map">
      <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
      </div>
    </div>

    <!-- === NORTH ARROW ELEMENT === -->
    <div id="north-arrow" title="Kembalikan tampilan ke arah utara"></div>

    <!-- === NORTH ARROW SCRIPT + HEADER HEIGHT SYNC === -->
    <script>
      function adjustMapTop() {
        const header = document.getElementById('header');
        const map = document.getElementById('map');
        const northArrow = document.getElementById('north-arrow');
        if (header && map) {
          const h = header.offsetHeight;
          map.style.top = h + 'px';
          if (northArrow) {
            northArrow.style.top = (h + 1) + 'px';
          }
        }
      }

      window.addEventListener('load', adjustMapTop);
      window.addEventListener('resize', adjustMapTop);

      document.addEventListener('DOMContentLoaded', function() {
        const northArrow = document.getElementById('north-arrow');
        if (!northArrow) return;

        northArrow.addEventListener('click', function() {
          if (typeof map !== 'undefined' && map.getView) {
            map.getView().animate({ rotation: 0, duration: 600 });
          }
        });

        if (typeof map !== 'undefined' && map.getView) {
          map.getView().on('change:rotation', function() {
            const rotation = map.getView().getRotation();
            northArrow.style.transform = 'rotate(' + (-rotation) + 'rad)';
          });
        }
      });

      // === LOADING SCREEN MINIMAL 5 DETIK ===
      const startTime = Date.now();
      window.addEventListener("load", () => {
        const elapsed = Date.now() - startTime;
        const remaining = 5000 - elapsed;
        const loader = document.getElementById("loading-screen");

        setTimeout(() => {
          loader.classList.add("fade-out");
          setTimeout(() => loader.style.display = "none", 600);
        }, remaining > 0 ? remaining : 0);
      });
    </script>
